# Stronghold Python ML Image
#
# Extends rocky-base with Python 3 + PyTorch (CPU) + common ML libraries.
#
# NOTE: CUDA is dropped from this build — it requires NVIDIA hardware + repos
# and bloats the image by 5+ GB. For GPU workloads, build a derived
# `python-ml-cuda` image on a GPU node with the NVIDIA container toolkit.

name = "python-ml"
extends = "rocky-base"
description = "Rocky 9 + Python 3 + PyTorch (CPU) + numpy/pandas/sklearn/matplotlib/jupyter"

[packages]
dnf = [
    "python3",
    "python3-pip",
    "python3-devel",
    "gcc",
    "gcc-c++",
    "make",
    "cmake",
    "glibc-langpack-en",
]

[env]
PYTHONPATH = "{home}/.local/lib/python3.9/site-packages"
PIP_NO_CACHE_DIR = "1"

[post_install]
commands = [
    "pip3 install --user torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu",
    "pip3 install --user numpy pandas scikit-learn matplotlib jupyter ipython",
    "dnf clean all",
    "rm -rf /var/cache/dnf",
]

[labels]
"org.opencontainers.image.title" = "stronghold/python-ml"
"org.opencontainers.image.description" = "Python 3 + PyTorch (CPU) + ML libraries for research"
