name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Build release binary
        run: cargo build --release --workspace --features no-sev-snp --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/stronghold-gateway release/
          cp target/${{ matrix.target }}/release/stronghold release/
          tar czf stronghold-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C release .

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: stronghold-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          generate_release_notes: true
