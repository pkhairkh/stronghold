[workspace]
resolver = "2"
members = ["gateway", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pkhairkh/stronghold"
homepage = "https://github.com/pkhairkh/stronghold"
documentation = "https://github.com/pkhairkh/stronghold/tree/main/docs"
authors = ["Stronghold Contributors"]
readme = "README.md"

[workspace.dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# TLS (post-quantum hybrid)
# rustls 0.23.22+ has built-in ML-KEM (X25519MLKEM768) key exchange via the
# `prefer-post-quantum` feature, layered on the aws_lc_rs crypto provider.
rustls = { version = "0.23", features = ["aws_lc_rs", "prefer-post-quantum"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
rustls-post-quantum = "0.2"

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Cryptography — classical
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
rand_core = "0.6"

# Cryptography — post-quantum (FIPS 203/204)
ml-dsa = "0.1"
# Pin ml-kem and kem to compatible versions (ml-kem 0.2.x needs kem 0.3.0-pre).
ml-kem = { version = "=0.2.1", features = ["deterministic"] }
kem = "=0.3.0-pre.0"
# Note: pqc-kyber is pulled in via rustls feature flag

# X.509 certificate generation (for self-signed TLS certs)
rcgen = "0.14"
time = "0.3"

# HTTP client (for ntfy, Vultr API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# PTY + process management
portable-pty = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
ulid = { version = "1.1", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# Regex (for anomaly scanning, whitelist matching)
regex = "1.10"
aho-corasick = "1.1"

# SEV-SNP (behind feature flag)
sev = "4.0"
bincode = "1.3"

# Container registry client
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }

# Kubernetes client (for k3s scheduler)
kube = { version = "0.95", default-features = false, features = ["client", "rustls-tls", "runtime", "ws"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# Property-based testing
proptest = "1.5"
tempfile = "3.10"
nix = { version = "0.29", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
