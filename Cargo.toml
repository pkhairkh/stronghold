[workspace]
resolver = "2"
members = ["gateway", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pkhairkh/stronghold"
homepage = "https://github.com/pkhairkh/stronghold"
documentation = "https://github.com/pkhairkh/stronghold/tree/main/docs"
authors = ["Stronghold Contributors"]
readme = "README.md"

[workspace.dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# TLS (post-quantum hybrid)
# Note: rustls 0.23 dropped the `pqc-kyber` feature. PQ key exchange
# (X25519Kyber768Draft00) is now provided via the `aws_lc_rs` crypto
# provider, which has Kyber built in. See ADR-0004 for the rationale.
rustls = { version = "0.23", features = ["ring", "aws_lc_rs"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
rustls-post-quantum = "0.2"

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Cryptography — classical
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
rand_core = "0.6"

# Cryptography — post-quantum (FIPS 203/204)
ml-dsa = "0.0.4"
ml-kem = "0.2"
# Note: pqc-kyber is pulled in via rustls feature flag

# HTTP client (for ntfy, Vultr API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# PTY + process management
portable-pty = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
ulid = { version = "1.1", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# Regex (for anomaly scanning, whitelist matching)
regex = "1.10"
aho-corasick = "1.1"

# SEV-SNP (behind feature flag)
sev = "4.0"

# Container registry client
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = true
