apiVersion: v1
kind: Namespace
metadata:
  name: stronghold-system
  labels:
    app.kubernetes.io/name: stronghold
    app.kubernetes.io/component: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stronghold-registry
  namespace: stronghold-system
  labels:
    app.kubernetes.io/name: stronghold-registry
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stronghold-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stronghold-registry
        app.kubernetes.io/component: registry
    spec:
      containers:
      - name: registry
        image: docker.io/library/registry:2.8.3
        ports:
        - containerPort: 5000
          name: registry
          protocol: TCP
        env:
        - name: REGISTRY_HTTP_ADDR
          value: :5000
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        - name: REGISTRY_LOG_LEVEL
          value: info
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
        readinessProbe:
          httpGet:
            path: /v2/
            port: registry
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /v2/
            port: registry
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: stronghold-registry-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stronghold-registry-data
  namespace: stronghold-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stronghold-registry
  namespace: stronghold-system
  labels:
    app.kubernetes.io/name: stronghold-registry
    app.kubernetes.io/component: registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: stronghold-registry
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
    nodePort: 30500
    protocol: TCP
---
# ClusterIP service so pods inside the cluster can resolve
# `stronghold-registry.stronghold-system.svc.cluster.local:5000`
# k3s containerd will be configured to mirror localhost:30500 → this service.
apiVersion: v1
kind: Service
metadata:
  name: stronghold-registry-internal
  namespace: stronghold-system
  labels:
    app.kubernetes.io/name: stronghold-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stronghold-registry
  ports:
  - name: registry
    port: 5000
    targetPort: 5000
    protocol: TCP
